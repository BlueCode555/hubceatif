spring.application.name=hubcreatif-backend
spring.session.store-type=none
spring.boot.autoconfigure.session.enabled=true
server.address=0.0.0.0
server.port=8087
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=hubcreatif
spring.jpa.properties.org.hibernate.envers.default_schema=audit
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.profiles.active=local
logging.level.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
server.servlet.context-path=/app
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Email (JavaMailSender)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Keycloak (Resource Server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/hubcreatifbd}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/hubcreatif/protocol/openid-connect/certs}
# Parametres Auth
# DEV_MODE doit etre false en production - ne jamais deployer avec true
auth.dev-mode=${DEV_MODE:false}
auth.code-expiration-minutes=${CODE_EXPIRATION_MINUTES:10}
auth.max-tentatives=${MAX_TENTATIVES_CODE:5}
auth.keycloak-realm=${KEYCLOAK_REALM:hubcreatif}
auth.keycloak-client-id=${KEYCLOAK_CLIENT_ID:}
auth.keycloak-client-secret=${KEYCLOAK_CLIENT_SECRET:}
auth.keycloak-url=${KEYCLOAK_URL:http://localhost:8080}
auth.keycloak-admin-user=${KEYCLOAK_ADMIN_USER:}
auth.keycloak-admin-password=${KEYCLOAK_ADMIN_PASSWORD:}
# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Compression GZIP (réduit la taille des réponses GeoJSON de 60-80%)
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json,text/plain,text/html
server.compression.min-response-size=1024

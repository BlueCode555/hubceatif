spring.application.name=hubcreatif-backend
spring.session.store-type=none
spring.boot.autoconfigure.session.enabled=true
server.address=0.0.0.0
server.port=8087

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/${DB_NAME:hubcreatifbd}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Fadoul@0153193525}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:hubcreatif}
spring.jpa.properties.org.hibernate.envers.default_schema=${DB_AUDIT_SCHEMA:audit}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.servlet.context-path=/app
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.config.activate.on-profile=local

# Keycloak (Resource Server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/hubcreatif}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/hubcreatif/protocol/openid-connect/certs}

# Parametres Auth
auth.dev-mode=${DEV_MODE:true}
auth.code-expiration-minutes=${CODE_EXPIRATION_MINUTES:10}
auth.max-tentatives=${MAX_TENTATIVES_CODE:3}
auth.keycloak-url=${KEYCLOAK_URL:http://localhost:8080}
auth.keycloak-realm=${KEYCLOAK_REALM:hubcreatif}
auth.keycloak-client-id=${KEYCLOAK_CLIENT_ID:hubcreatif-backend}
auth.keycloak-client-secret=${KEYCLOAK_CLIENT_SECRET:}
auth.keycloak-admin-user=${KEYCLOAK_ADMIN_USER:admin}
auth.keycloak-admin-password=${KEYCLOAK_ADMIN_PASSWORD:}

# Email (JavaMailSender)
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

name: CI Backend

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── CI : Build ───────────────────────────────────
  ci:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: ./mvnw clean package -DskipTests
